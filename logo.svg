<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#132318"/>
      <stop offset="55%" stop-color="#0a1710"/>
      <stop offset="100%" stop-color="#040a06"/>
    </radialGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4a3f"/>
      <stop offset="45%" stop-color="#1d2b21"/>
      <stop offset="100%" stop-color="#0d1712"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#c8860a"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ffde" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#37ff8c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f3d22" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#000000" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="900" height="900" fill="url(#bgGrad)"/>

  <!-- outer vault ring with bolt teeth -->
  <g stroke="#0c1a12" stroke-width="3">
    <circle cx="450" cy="420" r="300" fill="url(#doorGrad)"/>
  </g>
  <g fill="#25352a" stroke="#0a130d" stroke-width="2">
    <!-- 24 radial bolts around the rim -->
    <g id="bolts">
      <circle cx="450" cy="128" r="14"/>
      <circle cx="450" cy="712" r="14"/>
      <circle cx="158" cy="420" r="14"/>
      <circle cx="742" cy="420" r="14"/>
      <circle cx="243" cy="213" r="12"/>
      <circle cx="657" cy="213" r="12"/>
      <circle cx="243" cy="627" r="12"/>
      <circle cx="657" cy="627" r="12"/>
      <circle cx="330" cy="149" r="11"/>
      <circle cx="570" cy="149" r="11"/>
      <circle cx="330" cy="691" r="11"/>
      <circle cx="570" cy="691" r="11"/>
      <circle cx="185" cy="290" r="11"/>
      <circle cx="185" cy="550" r="11"/>
      <circle cx="715" cy="290" r="11"/>
      <circle cx="715" cy="550" r="11"/>
    </g>
  </g>

  <!-- rotating inner door ring -->
  <circle cx="450" cy="420" r="248" fill="none" stroke="url(#rimGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="450" cy="420" r="232" fill="#132018" stroke="#37ff8c" stroke-width="2" opacity="0.5"/>

  <!-- vault-door spokes -->
  <g stroke="#ffcf6b" stroke-width="5" opacity="0.8" filter="url(#glowAmber)">
    <line x1="450" y1="420" x2="450" y2="205"/>
    <line x1="450" y1="420" x2="450" y2="635"/>
    <line x1="450" y1="420" x2="235" y2="420"/>
    <line x1="450" y1="420" x2="665" y2="420"/>
    <line x1="450" y1="420" x2="298" y2="268"/>
    <line x1="450" y1="420" x2="602" y2="572"/>
    <line x1="450" y1="420" x2="602" y2="268"/>
    <line x1="450" y1="420" x2="298" y2="572"/>
  </g>

  <!-- central optic / robotic eye -->
  <circle cx="450" cy="420" r="120" fill="url(#coreGlow)"/>
  <circle cx="450" cy="420" r="86" fill="#081b10" stroke="#37ff8c" stroke-width="4" filter="url(#glowGreen)"/>
  <circle cx="450" cy="420" r="58" fill="#0b2717" stroke="#ffcf6b" stroke-width="3"/>
  <circle cx="450" cy="420" r="30" fill="#37ff8c" filter="url(#glowGreen)"/>
  <circle cx="450" cy="420" r="12" fill="#eafff2"/>

  <!-- crosshair / targeting ticks over the eye -->
  <g stroke="#c8ffde" stroke-width="2" opacity="0.7">
    <line x1="450" y1="318" x2="450" y2="336"/>
    <line x1="450" y1="504" x2="450" y2="522"/>
    <line x1="348" y1="420" x2="366" y2="420"/>
    <line x1="534" y1="420" x2="552" y2="420"/>
  </g>

  <!-- corner circuit traces (postmodern-robotic accents) -->
  <g stroke="#37ff8c" stroke-width="3" fill="none" opacity="0.55" filter="url(#glowGreen)">
    <path d="M 90 90 L 90 150 L 150 150"/>
    <path d="M 810 90 L 810 150 L 750 150"/>
    <path d="M 90 810 L 90 750 L 150 750"/>
    <path d="M 810 810 L 810 750 L 750 750"/>
    <circle cx="90" cy="90" r="6" fill="#37ff8c"/>
    <circle cx="810" cy="90" r="6" fill="#37ff8c"/>
    <circle cx="90" cy="810" r="6" fill="#37ff8c"/>
    <circle cx="810" cy="810" r="6" fill="#37ff8c"/>
  </g>

  <!-- title block -->
  <rect x="90" y="742" width="720" height="108" rx="6" fill="#081108" stroke="#ffcf6b" stroke-width="2" opacity="0.9"/>
  <text x="450" y="796" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold"
        font-size="54" letter-spacing="6" fill="#c8ffde" filter="url(#glowGreen)">EVIDENCE</text>
  <text x="450" y="836" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold"
        font-size="54" letter-spacing="10" fill="#ffcf6b" filter="url(#glowAmber)">VAULT</text>

  <!-- scanline overlay for CRT-terminal feel -->
  <rect width="900" height="900" fill="url(#scanlines)"/>
  <rect width="900" height="900" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="24"/>
</svg>
